name: Governance and Safety Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate discovery safety policy
        run: python cbs250_cli_discovery_v311.py --policy-check

      - name: Validate targeted L3 help policy
        run: python cbs250_targeted_help_probe.py --policy-check

      - name: Validate selector-level L3 help policy
        run: python cbs250_l3_selector_help_probe.py --policy-check

      - name: Validate retired show vlan authority
        run: python cbs250_r0_vlan_validation.py --policy-check

      - name: Validate isolated interfaces status R0 policy
        run: python cbs250_r0_interface_status_validation.py --policy-check

      - name: Run governance and safety tests
        run: python -m pytest -q
