name: CBS250 R0 Interface Status One Shot

on:
  push:
    branches:
      - live-test/r0-interface-status-once-20260827

permissions:
  contents: read

concurrency:
  group: cbs250-r0-interface-status-one-shot
  cancel-in-progress: true

jobs:
  r0-interface-status:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    env:
      CBS_HOST: ${{ secrets.CBS250_HOST }}
      CBS_USERNAME: ${{ secrets.CBS250_USERNAME }}
      CBS_PASSWORD: ${{ secrets.CBS250_PASSWORD }}
      VALIDATED_BASE_SHA: a54fb315db345bd3df9573e02e282ce06b14550c
      VALIDATED_BASE_RUN: 33033073651

    steps:
      - name: Checkout exact one-shot branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate runner-local Python
        shell: cmd
        run: |
          for %%I in ("%RUNNER_TEMP%\..\..") do set "RUNNER_ROOT=%%~fI"
          set "PYTHON_BASE=%RUNNER_ROOT%\_tooling\Python312\python.exe"
          if not exist "%PYTHON_BASE%" exit /b 1
          echo ::add-mask::%PYTHON_BASE%
          echo PYTHON_BASE=%PYTHON_BASE%>>"%GITHUB_ENV%"
          "%PYTHON_BASE%" --version
          "%PYTHON_BASE%" -c "import paramiko; print('PASS - runner-local Paramiko available')"

      - name: Require secrets before any device access
        shell: cmd
        run: |
          if "%CBS_HOST%"=="" exit /b 1
          if "%CBS_USERNAME%"=="" exit /b 1
          if "%CBS_PASSWORD%"=="" exit /b 1
          echo Secret-backed target credentials are present.

      - name: Bind to exact hosted CI passed source
        shell: cmd
        run: |
          echo Exact source base %VALIDATED_BASE_SHA% passed full Governance and Safety Gate in run %VALIDATED_BASE_RUN%.
          git diff --quiet %VALIDATED_BASE_SHA%..HEAD -- . ":(exclude).github/workflows/cbs250-r0-show-vlan-one-shot.yml"
          if errorlevel 1 (
            echo One-shot branch contains code changes beyond its workflow.
            exit /b 1
          )
          echo PASS - branch differs from validated base only by the one-shot workflow.

      - name: Run local safety policies before SSH
        shell: cmd
        run: |
          "%PYTHON_BASE%" .\cbs250_cli_discovery_v311.py --policy-check
          "%PYTHON_BASE%" .\cbs250_targeted_help_probe.py --policy-check
          "%PYTHON_BASE%" .\cbs250_l3_selector_help_probe.py --policy-check
          "%PYTHON_BASE%" .\cbs250_r0_vlan_validation.py --policy-check
          "%PYTHON_BASE%" .\cbs250_r0_interface_status_validation.py --policy-check

      - name: Enforce no-write authority before live validation
        shell: cmd
        run: |
          "%PYTHON_BASE%" -c "import json; d=json.load(open(r'governance\project_scope.json', encoding='utf-8')); assert d['global_device_write_authority'] is False; assert d['production_network_write_authority'] is False; print('PASS - all write authority remains disabled.')"

      - name: Run exact aggregate interface status validation only
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\cbs250-r0-interface-status" rmdir /s /q "%RUNNER_TEMP%\cbs250-r0-interface-status"
          mkdir "%RUNNER_TEMP%\cbs250-r0-interface-status"
          "%PYTHON_BASE%" .\cbs250_r0_interface_status_validation.py --host "%CBS_HOST%" --username "%CBS_USERNAME%" --password-env CBS_PASSWORD --output "%RUNNER_TEMP%\cbs250-r0-interface-status\interface_status_validation.sanitized.json"

      - name: Validate sanitized evidence contract
        shell: cmd
        run: |
          "%PYTHON_BASE%" -c "import json,re; p=json.load(open(r'%RUNNER_TEMP%\cbs250-r0-interface-status\interface_status_validation.sanitized.json',encoding='utf-8')); assert p['schema_version']==2; assert p['status']=='PASS_LIVE_PARSER_VALIDATED'; assert p['target']=={'product_id':'CBS250-24T-4X','firmware_version':'3.5.3.3'}; assert p['command']=='show interfaces status'; assert p['raw_output_retained'] is False; assert p['interface_ids_exported'] is False; assert p['media_details_exported'] is False; assert p['speed_details_exported'] is False; assert p['port_membership_exported'] is False; assert p['parsed_physical_row_count']>0; assert re.fullmatch(r'sha256:[0-9a-f]{64}',p['normalized_output_sha256']); assert p['authority']['device_write_authority'] is False; assert p['authority']['production_network_write_authority'] is False; assert p['authority']['collector_execution_authority'] is False; assert p['safety']['configuration_changed'] is False; assert p['safety']['reboot_or_reload_performed'] is False; assert p['safety']['specific_interface_command_executed'] is False; assert p['safety']['interface_state_changed'] is False; assert p['safety']['pager_navigation_sent'] is False; print('PASS - sanitized interface-status evidence contract')"

      - name: Upload sanitized validation only
        uses: actions/upload-artifact@v4
        with:
          name: cbs250-r0-interface-status-schema-v2-sanitized
          path: ${{ runner.temp }}/cbs250-r0-interface-status/interface_status_validation.sanitized.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary validation state
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\cbs250-r0-interface-status" rmdir /s /q "%RUNNER_TEMP%\cbs250-r0-interface-status"
